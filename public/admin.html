<div class="space-y-4">
    <input type="text" id="name" placeholder="اسم المنتج (مثلاً: عطر رصوف الفاخر)" class="w-full bg-slate-800 p-4 rounded-xl outline-none">
    <input type="text" id="price" placeholder="السعر (مثلاً: 250)" class="w-full bg-slate-800 p-4 rounded-xl outline-none">
    <input type="text" id="image" placeholder="رابط صورة المنتج (انسخ رابط الصورة من سلة)" class="w-full bg-slate-800 p-4 rounded-xl outline-none">
    <input type="url" id="productUrl" placeholder="رابط الشراء من سلة" class="w-full bg-slate-800 p-4 rounded-xl outline-none">
    <input type="color" id="btnColor" value="#c5a059" class="w-full h-12 rounded-xl mt-2 cursor-pointer">
    
    <button onclick="saveManual()" id="saveBtn" class="w-full bg-amber-600 py-4 rounded-xl font-bold">تحديث الصفحة الآن</button>
</div>

<script>
async function saveManual() {
    const data = {
        name: document.getElementById('name').value,
        price: document.getElementById('price').value,
        image: document.getElementById('image').value,
        productUrl: document.getElementById('productUrl').value,
        btnColor: document.getElementById('btnColor').value
    };

    const res = await fetch('/api/update-config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    
    if(res.ok) alert('✅ تم تحديث الصفحة بنجاح!');
}
</script>
