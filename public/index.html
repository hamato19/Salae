<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">العطر الفاخر | تجربة استثنائية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--dark); color: #fff; overflow-x: hidden; margin: 0; }
        .font-serif { font-family: 'Amiri', serif; }
        .gold-btn { background: linear-gradient(to right, var(--gold), #e2c58a); color: #000; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .parallax { background-attachment: fixed; background-position: center; background-repeat: no-repeat; background-size: cover; }
        
        /* تأثير حلقة التحميل */
        .loader-ring { width: 50px; height: 50px; border: 3px solid rgba(197, 160, 89, 0.2); border-radius: 50%; border-top-color: var(--gold); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* تخصيص الألوان ديناميكياً */
        .dynamic-bg { background-color: var(--gold); }
        .dynamic-text { color: var(--gold); }
        .dynamic-border { border-color: var(--gold); }
    </style>
</head>
<body>

    <div id="loading-screen" class="fixed inset-0 z-[200] bg-[#0a0a0a] flex flex-col items-center justify-center transition-opacity duration-1000">
        <div class="loader-ring mb-4"></div>
        <p class="text-gold tracking-[0.2em] animate-pulse text-[10px] uppercase">Luxury is loading</p>
    </div>

    <section class="relative h-screen flex items-center justify-center overflow-hidden">
        <div id="hero-bg" class="absolute inset-0 z-0 parallax opacity-40 scale-110 transition-transform duration-[4000ms]"></div>
        
        <div class="relative z-10 text-center px-4">
                       <h2 class="dynamic-text tracking-[0.4em] text-xs uppercase mb-4" data-aos="fade-up">Exclusive Collection</h2>
            <h1 id="product-name" class="font-serif text-5xl md:text-7xl mb-6 leading-tight" data-aos="fade-up" data-aos-delay="200">...جاري التحميل</h1>
            <div class="flex items-center justify-center gap-4 mb-8" data-aos="fade-up" data-aos-delay="400">
                <span class="h-[1px] w-12 bg-white/30"></span>
                <p id="product-price" class="text-2xl font-light tracking-widest text-slate-300">...</p>
                <span class="h-[1px] w-12 bg-white/30"></span>
            </div>
            <a id="buy-link" href="#" class="gold-btn inline-block px-12 py-5 rounded-full text-sm font-bold uppercase tracking-widest hover:scale-105 transition-transform" data-aos="zoom-in" data-aos-delay="600">
                اطلب الآن
            </a>
        </div>
        
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce opacity-40">
            <div class="w-[1px] h-12 bg-white"></div>
        </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        async function loadProductData() {
            try {
                // التعديل السحري هنا: إضافة التاريخ لمنع التخزين المؤقت (Cache)
                const response = await fetch('./config.json?v=' + Date.now());
                if (!response.ok) throw new Error('فشل تحميل الإعدادات');
                
                const data = await response.json();

                if (data.name) {
                    // تحديث النصوص
                    document.getElementById('product-name').innerText = data.name;
                    document.getElementById('page-title').innerText = data.name + ' | رصوف';
                    document.getElementById('product-price').innerText = data.price + ' ' + (data.currency || 'ر.س');
                    
                    // تحديث الروابط والصور
                    document.getElementById('buy-link').href = data.url;
                    document.getElementById('hero-bg').style.backgroundImage = `url('${data.image}')`;
                    
                    // تحديث الألوان الديناميكية
                    if (data.btnColor) {
                        document.documentElement.style.setProperty('--gold', data.btnColor);
                    }

                    // إخفاء شاشة التحميل
                    setTimeout(() => {
                        document.getElementById('loading-screen').classList.add('opacity-0');
                        setTimeout(() => {
                            document.getElementById('loading-screen').style.display = 'none';
                            document.getElementById('hero-bg').classList.remove('scale-110');
                        }, 1000);
                    }, 500);
                }
            } catch (error) {
                console.error('حدث خطأ:', error);
                document.getElementById('product-name').innerText = "يرجى ضبط الإعدادات من لوحة التحكم";
            }
        }

        // تشغيل الجلب فور تحميل الصفحة
        window.onload = loadProductData;
    </script>
</body>
</html>
